server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: certificate-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:certificate_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:certificate_user}
    password: ${DB_PASSWORD:certificate_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # MUST match auth-service's app.jwt.secret — this service only verifies tokens.
    secret: ${JWT_SECRET:change-this-to-a-long-random-base64-secret-in-production-min-256-bits}
    issuer: elearning-auth-service
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  enrollment-service:
    base-url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
  frontend:
    # used to build the public "share this certificate" link returned to the student
    base-url: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    com.elearning.certificate: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
