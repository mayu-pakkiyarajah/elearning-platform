spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-for-production-use-1234567890
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: elearning-auth-service-test
  password-reset:
    token-expiration-minutes: 30
  cors:
    allowed-origins: http://localhost:4200
