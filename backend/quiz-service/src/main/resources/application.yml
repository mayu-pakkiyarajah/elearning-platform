server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: quiz-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quiz_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:quiz_user}
    password: ${DB_PASSWORD:quiz_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # MUST match auth-service's app.jwt.secret — this service only verifies tokens.
    secret: ${JWT_SECRET:change-this-to-a-long-random-base64-secret-in-production-min-256-bits}
    issuer: elearning-auth-service
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  course-service:
    base-url: ${COURSE_SERVICE_URL:http://localhost:8082}
  enrollment-service:
    base-url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}

logging:
  level:
    com.elearning.quiz: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
