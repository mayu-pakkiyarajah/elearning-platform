server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: course-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:course_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:course_user}
    password: ${DB_PASSWORD:course_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # MUST match auth-service's app.jwt.secret — both services verify the same
    # tokens, only auth-service issues them. In a real deployment this comes
    # from config-server / a secrets manager, not duplicated per-service config.
    secret: ${JWT_SECRET:change-this-to-a-long-random-base64-secret-in-production-min-256-bits}
    issuer: elearning-auth-service
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    com.elearning.course: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
