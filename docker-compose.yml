version: "3.9"

services:
  auth-mysql:
    image: mysql:8.4
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3307:3306"   # host:container — 3307 avoids clashing with a local MySQL on 3306
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      auth-mysql:
        condition: service_healthy
    environment:
      DB_HOST: auth-mysql
      DB_PORT: 3306
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      JWT_SECRET: change-this-to-a-long-random-base64-secret-in-production-min-256-bits
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8081:8081"

  course-mysql:
    image: mysql:8.4
    container_name: course-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: course_db
      MYSQL_USER: course_user
      MYSQL_PASSWORD: course_pass
    ports:
      - "3308:3306"
    volumes:
      - course_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  course-service:
    build:
      context: ./backend/course-service
    container_name: course-service
    restart: unless-stopped
    depends_on:
      course-mysql:
        condition: service_healthy
    environment:
      DB_HOST: course-mysql
      DB_PORT: 3306
      DB_NAME: course_db
      DB_USER: course_user
      DB_PASSWORD: course_pass
      # MUST match auth-service's JWT_SECRET above — this service only verifies tokens.
      JWT_SECRET: change-this-to-a-long-random-base64-secret-in-production-min-256-bits
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8082:8082"

  enrollment-mysql:
    image: mysql:8.4
    container_name: enrollment-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: enrollment_db
      MYSQL_USER: enrollment_user
      MYSQL_PASSWORD: enrollment_pass
    ports:
      - "3309:3306"
    volumes:
      - enrollment_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  enrollment-service:
    build:
      context: ./backend/enrollment-service
    container_name: enrollment-service
    restart: unless-stopped
    depends_on:
      enrollment-mysql:
        condition: service_healthy
      course-service:
        condition: service_started
    environment:
      DB_HOST: enrollment-mysql
      DB_PORT: 3306
      DB_NAME: enrollment_db
      DB_USER: enrollment_user
      DB_PASSWORD: enrollment_pass
      # MUST match auth-service's JWT_SECRET above — this service only verifies tokens.
      JWT_SECRET: change-this-to-a-long-random-base64-secret-in-production-min-256-bits
      CORS_ORIGINS: http://localhost:4200
      COURSE_SERVICE_URL: http://course-service:8082
    ports:
      - "8083:8083"

volumes:
  auth_mysql_data:
  course_mysql_data:
  enrollment_mysql_data:

# As each new service is added (course-service, enrollment-service, ...):
#   1. add a `<service>-mysql` block following the auth-mysql pattern (own DB per service)
#   2. add a `<service>` block following the auth-service pattern
#   3. later: replace direct port exposure with routing through api-gateway,
#      and add discovery-server + config-server once those exist.
