<div>
  @if (!submitted()) {
    <h1 class="font-display fs-3 mb-1">Reset your password</h1>
    <p class="text-muted mb-4">Enter your email and we'll send you a reset link.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="f.email.invalid && f.email.touched"
          autocomplete="email"
        />
        @if (f.email.invalid && f.email.touched) {
          <div class="invalid-feedback">Enter a valid email address.</div>
        }
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm me-2"></span> Sending…
        } @else {
          Send reset link
        }
      </button>
    </form>
  } @else {
    <app-alert type="success" message="If that email is registered, a reset link is on its way." />
  }

  <p class="text-center text-muted mt-4 mb-0">
    <a routerLink="/auth/login" class="text-decoration-none">Back to log in</a>
  </p>
</div>
